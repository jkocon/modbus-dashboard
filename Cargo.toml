[package]
name = "modbus-dashboard"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "Modbus RTU / TCP dashboard for RS485 and network devices, in a native window"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serialport = "4"
tao = "0.37"
tiny_http = "0.12"
wry = "0.57"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
